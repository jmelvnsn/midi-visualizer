<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI Visualizer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; user-select: none; }
  canvas { position: fixed; top: 0; left: 0; display: block; z-index: 0; }
  #hud {
    position: fixed; bottom: 0; left: 0; right: 0; height: 40px;
    display: flex; align-items: center; padding: 0 14px; gap: 12px;
    background: rgba(0,0,0,0.72); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.09); z-index: 100; font-size: 11px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #333; flex-shrink: 0; }
  .dot.connected { background: #3f3; }
  .dot.flash { background: #ff0 !important; }
  #status-label { color: rgba(255,255,255,0.55); white-space: nowrap; min-width: 110px; }
  select, button {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; font-family: inherit; font-size: 11px; border-radius: 3px;
    padding: 3px 8px; cursor: pointer; outline: none;
  }
  select:hover, button:hover { background: rgba(255,255,255,0.16); }
  select option { background: #111; }
  #event-log { margin-left: auto; color: rgba(255,255,255,0.35); font-size: 10px; white-space: nowrap; }
  #panel {
    position: fixed; bottom: 40px; left: 0; right: 0; max-height: 60vh; overflow-y: auto;
    background: rgba(10,10,10,0.88); backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255,255,255,0.1); padding: 18px 20px 22px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 20px 28px; z-index: 99; transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.4,0,.2,1);
  }
  #panel.open { transform: translateY(0); }
  .group { display: flex; flex-direction: column; gap: 7px; }
  .group-title { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-bottom: 2px; }
  .row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; }
  .row span { color: rgba(255,255,255,0.5); }
  .row .val { color: rgba(255,255,255,0.85); min-width: 30px; text-align: right; }
  input[type=range] { width: 100%; height: 3px; accent-color: rgba(255,255,255,0.7); cursor: pointer; }
  input[type=color] { width: 100%; height: 28px; border: 1px solid rgba(255,255,255,0.12); border-radius: 3px; background: none; cursor: pointer; padding: 0 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { padding: 3px 9px; border: 1px solid rgba(255,255,255,0.15); border-radius: 2px; font-size: 10px; cursor: pointer; background: rgba(255,255,255,0.04); }
  .chip.on { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.45); }
  #demo-btn.running { color: #ff0; border-color: rgba(255,255,0,0.4); background: rgba(255,255,0,0.06); }
  #hint { position: fixed; bottom: 50px; right: 16px; font-size: 9px; color: rgba(255,255,255,0.18); z-index: 98; line-height: 1.7; text-align: right; pointer-events: none; }
</style>
</head>
<body>

<div id="hint">S &mdash; settings &nbsp;|&nbsp; C &mdash; clear &nbsp;|&nbsp; Space &mdash; demo</div>

<div id="hud">
  <div class="dot" id="dot"></div>
  <span id="status-label">No MIDI</span>
  <select id="device-select"><option value="">-- device --</option></select>
  <select id="ch-select"><option value="-1">All Ch</option></select>
  <button id="settings-btn">Settings</button>
  <button id="clear-btn">Clear</button>
  <button id="demo-btn">Demo</button>
  <span id="event-log">--</span>
</div>

<div id="panel">
  <div class="group">
    <div class="group-title">Color</div>
    <select id="color-mode">
      <option value="chromatic">Chromatic (note to hue)</option>
      <option value="velocity">Velocity (cool to warm)</option>
      <option value="random">Random</option>
      <option value="mono">Monochrome</option>
    </select>
    <input type="color" id="mono-color" value="#ffffff">
  </div>
  <div class="group">
    <div class="group-title">Shapes</div>
    <div class="chips" id="shape-chips">
      <div class="chip on" data-shape="circle">Circle</div>
      <div class="chip on" data-shape="ring">Ring</div>
      <div class="chip on" data-shape="rect">Rect</div>
      <div class="chip on" data-shape="diamond">Diamond</div>
      <div class="chip on" data-shape="triangle">Triangle</div>
      <div class="chip on" data-shape="star">Star</div>
    </div>
  </div>
  <div class="group">
    <div class="group-title">Size (velocity maps to size)</div>
    <div class="row"><span>Min</span><span class="val" id="min-size-v">8</span></div>
    <input type="range" id="min-size" min="2" max="200" value="8">
    <div class="row"><span>Max</span><span class="val" id="max-size-v">140</span></div>
    <input type="range" id="max-size" min="10" max="600" value="140">
  </div>
  <div class="group">
    <div class="group-title">Canvas</div>
    <div class="row"><span>Clear after N shapes</span><span class="val" id="max-v">150</span></div>
    <input type="range" id="max-shapes" min="10" max="800" value="150">
    <div class="row"><span>Burst (vel-scaled extras)</span><span class="val" id="burst-v">0</span></div>
    <input type="range" id="burst" min="0" max="8" value="0" step="1">
  </div>
  <div class="group">
    <div class="group-title">Position</div>
    <select id="pos-mode">
      <option value="random">Fully random</option>
      <option value="note-x">Note maps to X</option>
      <option value="quadrant">Note maps to quadrant</option>
      <option value="radial">Radial from center</option>
      <option value="center">Center cluster</option>
    </select>
    <div class="group-title" style="margin-top:6px">Velocity maps to</div>
    <select id="vel-mode">
      <option value="size">Size</option>
      <option value="brightness">Brightness</option>
      <option value="both">Size + brightness</option>
    </select>
  </div>
  <div class="group">
    <div class="group-title">Background</div>
    <input type="color" id="bg-color" value="#000000">
  </div>
</div>

<script>
'use strict';

// Config
const cfg = {
  colorMode: 'chromatic',
  monoColor: '#ffffff',
  shapes:    new Set(['circle','ring','rect','diamond','triangle','star']),
  minSize:   8,
  maxSize:   140,
  maxShapes: 150,
  burst:     0,
  posMode:   'random',
  velMode:   'size',
  bgColor:   '#000000',
};

// MIDI note queue -- populated by MIDI callbacks, consumed by draw()
const noteQueue = [];
let shapeCount  = 0;

// p5.js lifecycle
function setup() {
  const cnv = createCanvas(windowWidth, windowHeight);
  cnv.elt.style.position = 'fixed';
  cnv.elt.style.top      = '0';
  cnv.elt.style.left     = '0';
  cnv.elt.style.zIndex   = '0';
  background(bgColor());
  noSmooth();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  background(bgColor());
}

// draw() only does work when MIDI events are queued
function draw() {
  if (noteQueue.length === 0) return;
  while (noteQueue.length > 0) {
    const ev = noteQueue.shift();
    stampShape(ev.note, ev.velocity);
    shapeCount++;
  }
  if (shapeCount >= cfg.maxShapes) {
    clearCanvas();
  }
}

function keyPressed() {
  if (key === 'c' || key === 'C') { clearCanvas(); return false; }
  if (key === 's' || key === 'S') { document.getElementById('settings-btn').click(); return false; }
  if (key === ' ') { document.getElementById('demo-btn').click(); return false; }
}

function bgColor() {
  const h = cfg.bgColor;
  return color(parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16));
}

function clearCanvas() {
  background(bgColor());
  shapeCount = 0;
}

// Color -- returns a p5 color object
function shapeColor(note, velNorm) {
  const bv = (cfg.velMode === 'brightness' || cfg.velMode === 'both')
    ? velNorm : 0.55 + velNorm * 0.25;
  switch (cfg.colorMode) {
    case 'chromatic': {
      const h = (note % 12) * 30;
      const s = 72 + velNorm * 28;
      const l = cfg.velMode === 'size' ? 48 + velNorm * 14 : 26 + bv * 46;
      return color('hsl(' + h + ',' + s + '%,' + l + '%)');
    }
    case 'velocity': {
      const h = 240 - velNorm * 240;
      return color('hsl(' + h + ',85%,' + (33 + bv * 32) + '%)');
    }
    case 'random': {
      const h = Math.random() * 360;
      const s = 70 + Math.random() * 30;
      const l = 40 + Math.random() * 22;
      return color('hsl(' + h + ',' + s + '%,' + l + '%)');
    }
    case 'mono':
      return color(cfg.monoColor);
  }
}

// Position
function shapePos(note) {
  const W = width, H = height;
  switch (cfg.posMode) {
    case 'note-x':
      return [note / 127 * W, Math.random() * H];
    case 'quadrant': {
      const q = Math.floor(note / 128 * 4);
      return [(q % 2) * W/2 + Math.random() * W/2,
              Math.floor(q/2) * H/2 + Math.random() * H/2];
    }
    case 'radial': {
      const a = note / 127 * Math.PI * 2;
      const r = 80 + Math.random() * Math.min(W,H) * 0.38;
      return [W/2 + Math.cos(a)*r, H/2 + Math.sin(a)*r];
    }
    case 'center': {
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * Math.min(W,H) * 0.15;
      return [W/2 + Math.cos(a)*r, H/2 + Math.sin(a)*r];
    }
    default:
      return [Math.random() * W, Math.random() * H];
  }
}

// Stamp a shape permanently onto the canvas
function stampShape(note, velocity) {
  const velNorm  = velocity / 127;
  const [x, y]   = shapePos(note);
  const sizeMult  = (cfg.velMode === 'size' || cfg.velMode === 'both')
    ? velNorm : 0.5 + Math.random() * 0.5;
  const sz  = cfg.minSize + sizeMult * (cfg.maxSize - cfg.minSize);
  const hs  = sz / 2;
  const lw  = Math.max(2, sz * 0.07);
  const arr = [...cfg.shapes];
  if (!arr.length) return;
  const type = arr[note % arr.length];
  const c    = shapeColor(note, velNorm);

  push();
  switch (type) {
    case 'circle':
      noStroke(); fill(c);
      ellipse(x, y, sz, sz);
      break;

    case 'ring':
      noFill(); stroke(c); strokeWeight(lw);
      ellipse(x, y, sz, sz);
      break;

    case 'rect':
      noStroke(); fill(c);
      rectMode(CENTER);
      rect(x, y, sz, sz);
      break;

    case 'diamond':
      noStroke(); fill(c);
      beginShape();
      vertex(x,      y - hs);
      vertex(x + hs, y);
      vertex(x,      y + hs);
      vertex(x - hs, y);
      endShape(CLOSE);
      break;

    case 'triangle':
      noStroke(); fill(c);
      triangle(
        x,                y - hs,
        x + hs * 0.866,   y + hs * 0.5,
        x - hs * 0.866,   y + hs * 0.5
      );
      break;

    case 'star':
      noStroke(); fill(c);
      beginShape();
      for (let i = 0; i < 10; i++) {
        const a = i / 10 * Math.PI * 2 - Math.PI / 2;
        const r = i % 2 === 0 ? hs : hs * 0.42;
        vertex(x + Math.cos(a) * r, y + Math.sin(a) * r);
      }
      endShape(CLOSE);
      break;
  }
  pop();
}

// MIDI
let midi = null, activeInput = null, midiChannel = -1;
const dotEl       = document.getElementById('dot');
const statusLabel = document.getElementById('status-label');
const deviceSel   = document.getElementById('device-select');
const chSel       = document.getElementById('ch-select');
const eventLog    = document.getElementById('event-log');
let flashTimer;

function flashDot() {
  dotEl.classList.add('flash');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => dotEl.classList.remove('flash'), 75);
}

async function initMIDI() {
  if (!navigator.requestMIDIAccess) { statusLabel.textContent = 'Web MIDI not supported'; return; }
  try {
    midi = await navigator.requestMIDIAccess({ sysex: false });
    buildDeviceList();
    midi.onstatechange = buildDeviceList;
  } catch(e) { statusLabel.textContent = 'MIDI permission denied'; }
}

function buildDeviceList() {
  const inputs = [...midi.inputs.values()];
  const prev   = deviceSel.value;
  deviceSel.innerHTML = '<option value="">-- device --</option>';
  inputs.forEach(inp => {
    const o = document.createElement('option');
    o.value = inp.id; o.textContent = inp.name;
    deviceSel.appendChild(o);
  });
  if (inputs.find(i => i.id === prev)) deviceSel.value = prev;
  else if (inputs.length === 1) { deviceSel.value = inputs[0].id; connectInput(inputs[0].id); }
  else { statusLabel.textContent = inputs.length ? 'Select device' : 'No MIDI devices'; dotEl.className = 'dot'; }
}

function connectInput(id) {
  if (activeInput) activeInput.onmidimessage = null;
  activeInput = id ? midi.inputs.get(id) : null;
  if (activeInput) { activeInput.onmidimessage = onMIDI; statusLabel.textContent = activeInput.name; dotEl.className = 'dot connected'; }
  else { statusLabel.textContent = 'No device'; dotEl.className = 'dot'; }
}

deviceSel.addEventListener('change', () => connectInput(deviceSel.value));

for (let i = 1; i <= 16; i++) {
  const o = document.createElement('option');
  o.value = i - 1; o.textContent = 'Ch ' + i;
  chSel.appendChild(o);
}
chSel.addEventListener('change', () => { midiChannel = parseInt(chSel.value); });

function onMIDI(e) {
  const [status, data1, data2] = e.data;
  if (status === 0xF8 || status === 0xFE) return;
  const type = status & 0xF0, ch = status & 0x0F;
  if (midiChannel !== -1 && ch !== midiChannel) return;
  if (type === 0x90 && data2 > 0) {
    flashDot();
    eventLog.textContent = 'note ' + data1 + '  vel ' + data2 + '  ch ' + (ch + 1);
    noteQueue.push({ note: data1, velocity: data2 });
    const extras = Math.floor(cfg.burst * data2 / 127);
    for (let i = 0; i < extras; i++) {
      noteQueue.push({
        note:     (data1 + Math.floor(Math.random() * 5 - 2) + 128) % 128,
        velocity: Math.max(1, Math.floor(data2 * (0.4 + Math.random() * 0.6)))
      });
    }
  }
}

initMIDI();

// Demo mode
let demoTimer = null;
const demoBtn     = document.getElementById('demo-btn');
const DEMO_NOTES  = [36,38,42,46,49,51,36,38,40,43,45,47];

function runDemo() {
  const note = DEMO_NOTES[Math.floor(Math.random() * DEMO_NOTES.length)];
  const vel  = Math.floor(40 + Math.random() * 88);
  flashDot();
  eventLog.textContent = '[demo] note ' + note + '  vel ' + vel;
  noteQueue.push({ note, velocity: vel });
  demoTimer = setTimeout(runDemo, 40 + Math.random() * 160);
}

demoBtn.addEventListener('click', () => {
  if (demoTimer) {
    clearTimeout(demoTimer); demoTimer = null;
    demoBtn.classList.remove('running'); demoBtn.textContent = 'Demo';
  } else {
    demoBtn.classList.add('running'); demoBtn.textContent = 'Stop';
    runDemo();
  }
});

// Settings UI
const panel       = document.getElementById('panel');
const settingsBtn = document.getElementById('settings-btn');

document.getElementById('clear-btn').addEventListener('click', clearCanvas);

settingsBtn.addEventListener('click', () => {
  const open = panel.classList.toggle('open');
  settingsBtn.textContent = open ? 'Settings' : 'Settings';
});

function bindRange(id, valId, fn) {
  const el = document.getElementById(id);
  const vl = document.getElementById(valId);
  el.addEventListener('input', () => { fn(+el.value); vl.textContent = +el.value; });
}

bindRange('min-size',   'min-size-v', v => { cfg.minSize   = v; });
bindRange('max-size',   'max-size-v', v => { cfg.maxSize   = v; });
bindRange('max-shapes', 'max-v',      v => { cfg.maxShapes = v; });
bindRange('burst',      'burst-v',    v => { cfg.burst     = v; });

document.getElementById('color-mode').addEventListener('change', e => { cfg.colorMode = e.target.value; });
document.getElementById('mono-color').addEventListener('input',  e => { cfg.monoColor = e.target.value; });
document.getElementById('bg-color').addEventListener('input',    e => { cfg.bgColor   = e.target.value; });
document.getElementById('pos-mode').addEventListener('change',   e => { cfg.posMode   = e.target.value; });
document.getElementById('vel-mode').addEventListener('change',   e => { cfg.velMode   = e.target.value; });

document.querySelectorAll('.chip').forEach(el => {
  el.addEventListener('click', () => {
    const s = el.dataset.shape;
    if (cfg.shapes.has(s)) {
      if (cfg.shapes.size > 1) { cfg.shapes.delete(s); el.classList.remove('on'); }
    } else {
      cfg.shapes.add(s); el.classList.add('on');
    }
  });
});
</script>
</body>
</html>
